<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="theme-color" content="#0b0b14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Rinseki的本子站" />
  <title>Rinseki的本子站</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="icon" type="image/jpeg" href="/static/icon.jpg" />
  <link rel="apple-touch-icon" href="/static/icon.jpg" />
  <link rel="stylesheet" href="/static/styles.css?v=6" />
  <script type="module" src="/static/app.js?v=6" defer></script>
</head>
<body>
  <!-- Subtle Ambient Background Glow -->
  <div class="ambient-bg" aria-hidden="true"></div>

  <!-- Auth Gate -->
  <div id="authGate" class="auth-gate hidden">
    <div class="auth-card">
      <div class="auth-avatar-wrap">
        <img src="/static/icon.jpg" alt="Rinseki的本子站" class="auth-avatar" />
      </div>
      <h1>Rinseki的本子站</h1>
      <p class="muted">此站点已启用私密口令保护，请输入访问口令进入。</p>
      <form id="authForm" class="auth-form">
        <div class="input-with-icon">
          <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
          </svg>
          <input
            id="authPasswordInput"
            type="password"
            placeholder="请输入访问口令"
            autocomplete="current-password"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary btn-lg" id="authSubmitBtn">进入站点</button>
      </form>
      <p id="authError" class="error-text hidden"></p>
    </div>
  </div>

  <!-- Main App Shell -->
  <div id="appShell" class="app-shell hidden">
    <!-- Reading Progress Line (visible in reader) -->
    <div id="scrollProgressTrack" class="scroll-progress-track hidden">
      <div id="scrollProgressBar" class="scroll-progress-bar"></div>
    </div>

    <!-- Top Header -->
    <header class="topbar" id="mainTopbar">
      <div class="topbar-inner">
        <button class="brand" id="brandHomeBtn" type="button" title="返回首页">
          <img src="/static/icon.jpg" alt="Rinseki的本子站" class="brand-avatar" />
          <span class="brand-title">Rinseki<span class="brand-accent">的本子站</span></span>
        </button>

        <form class="header-search" id="headerSearchForm">
          <select id="searchModeSelect" aria-label="搜索模式">
            <option value="auto">智能</option>
            <option value="id">编号</option>
            <option value="keyword">关键词</option>
          </select>
          <div class="header-search-input-wrap">
            <input
              id="searchInput"
              type="text"
              placeholder="输入 JM 编号（如 422866）或关键词..."
              autocomplete="off"
            />
          </div>
          <button type="submit" class="btn btn-primary btn-sm">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>搜索</span>
          </button>
        </form>

        <div class="topbar-actions">
          <button id="themeToggleBtn" class="btn btn-ghost btn-icon" type="button" title="切换暗色/浅色主题" aria-label="切换主题">
            <span id="themeIcon"></span>
          </button>
          <button id="logoutBtn" class="btn btn-ghost btn-sm hidden" type="button" title="退出登录">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span class="hide-xs">退出</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Views -->
    <main class="main-container">
      <!-- Global Notice / Error Banner -->
      <div id="globalAlert" class="alert hidden"></div>

      <!-- Home / Search View -->
      <section id="viewHome" class="view">
        <div class="hero-card" id="heroCard">
          <div class="hero-pill">
            <span class="hero-dot"></span>
            无状态实时解密 · 浏览器本地 ZIP 打包
          </div>
          <h1>随时随地，<span class="text-gradient">纯粹阅读</span></h1>
          <p class="hero-subtitle muted">支持纯数字编号、JM 编号、链接直达与全站关键词检索，流畅条漫与单页翻页体验。</p>
          <form class="hero-search" id="heroSearchForm">
            <div class="hero-search-box">
              <svg class="hero-search-icon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input
                id="heroSearchInput"
                type="text"
                placeholder="输入漫画编号（如 422866）或关键词..."
                autocomplete="off"
              />
              <button type="submit" class="btn btn-primary">立即查找</button>
            </div>
          </form>
          <div class="hero-hints">
            <span class="hint-badge">编号直达 <code>422866</code></span>
            <span class="hint-badge">前缀识别 <code>JM422866</code></span>
            <span class="hint-badge">关键词 / 标签搜索</span>
          </div>
        </div>

        <!-- Favorites / Bookshelf -->
        <div id="favoritesSection" class="section-block hidden">
          <div class="section-header">
            <div class="section-title-group">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
              </svg>
              <h2>我的收藏</h2>
            </div>
            <div class="section-actions">
              <span id="favoritesCount" class="meta-pill">0 本</span>
              <button id="exportBackupBtn" class="btn btn-ghost btn-xs" type="button" title="导出收藏与阅读进度备份">导出备份</button>
              <button id="importBackupBtn" class="btn btn-ghost btn-xs" type="button" title="从 JSON 文件恢复收藏与进度">导入恢复</button>
              <input id="importBackupInput" type="file" accept=".json,application/json" class="hidden" />
            </div>
          </div>
          <div id="favoritesGrid" class="comic-grid"></div>
        </div>

        <!-- History -->
        <div id="historySection" class="section-block hidden">
          <div class="section-header">
            <div class="section-title-group">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <h2>最近浏览</h2>
            </div>
            <div class="section-actions">
              <button id="historyImportBackupBtn" class="btn btn-ghost btn-xs" type="button" title="导入收藏与阅读进度">导入备份</button>
              <button id="clearHistoryBtn" class="btn btn-ghost btn-xs" type="button">清空记录</button>
            </div>
          </div>
          <div id="historyList" class="history-chips"></div>
        </div>

        <!-- Search Results -->
        <div id="searchResultsSection" class="section-block hidden">
          <div class="section-header">
            <div class="section-title-group">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
              </svg>
              <h2 id="searchResultsHeading">搜索结果</h2>
            </div>
            <div class="section-actions">
              <select id="searchOrderSelect" class="compact-select" aria-label="排序方式">
                <option value="mr">按最新</option>
                <option value="mv">最多观看</option>
                <option value="tf">最多点赞</option>
                <option value="mp">最多图片</option>
              </select>
              <span id="searchResultsMeta" class="meta-pill"></span>
            </div>
          </div>
          <div id="searchResultsGrid" class="comic-grid"></div>
          <div id="searchPagination" class="pagination hidden"></div>
        </div>

        <!-- Discover / Rankings -->
        <div id="discoverSection" class="section-block">
          <div class="section-header">
            <div class="section-title-group">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
              </svg>
              <h2>发现与排行</h2>
            </div>
            <div class="discover-tabs" id="discoverTabs">
              <button class="tab-btn active" type="button" data-discover-tab="week">周榜</button>
              <button class="tab-btn" type="button" data-discover-tab="month">月榜</button>
              <button class="tab-btn" type="button" data-discover-tab="latest">最新</button>
              <button class="tab-btn" type="button" data-discover-tab="all">高赞</button>
            </div>
          </div>
          <div id="discoverGrid" class="comic-grid"></div>
          <div id="discoverPagination" class="pagination hidden"></div>
        </div>
      </section>

      <!-- Album Detail View -->
      <section id="viewAlbum" class="view hidden">
        <div class="view-nav">
          <button id="backFromAlbumBtn" class="btn btn-ghost btn-sm" type="button">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>返回列表</span>
          </button>
        </div>
        <div id="albumDetailContainer"></div>
      </section>

      <!-- Reader View -->
      <section id="viewReader" class="view reader-view hidden">
        <div class="reader-toolbar">
          <div class="reader-toolbar-left">
            <button id="backFromReaderBtn" class="btn btn-ghost btn-sm" type="button" title="返回详情">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
              </svg>
              <span class="hide-xs">详情</span>
            </button>
            <span id="readerTitle" class="reader-title"></span>
          </div>
          <div class="reader-toolbar-center">
            <select id="readerChapterSelect" aria-label="切换章节"></select>
            <div class="mode-switch">
              <button id="modeScrollBtn" class="btn btn-sm" type="button">条漫</button>
              <button id="modeSingleBtn" class="btn btn-sm" type="button">单页</button>
              <button id="modeDoubleBtn" class="btn btn-sm hide-xs" type="button" title="双页对开（桌面/平板）">双页</button>
            </div>
            <label class="width-control" id="widthControlLabel" title="调整阅读宽度">
              <span class="muted">宽度</span>
              <input id="readerWidthSlider" type="range" min="45" max="100" value="80" />
            </label>
          </div>
          <div class="reader-toolbar-right">
            <button id="readerProgressBtn" class="progress-pill progress-pill-btn" type="button" title="点击展开快捷跳页与阅读设置">
              <span id="readerProgressText">0 / 0</span>
            </button>
            <button id="readerDownloadChapterBtn" class="btn btn-primary btn-sm" type="button" title="下载本话 ZIP">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span class="hide-xs">本话 ZIP</span>
            </button>
          </div>
        </div>

        <!-- Reader Quick Popover Drawer (Jump Slider, Brightness, Auto-Scroll, Fullscreen, RTL, PDF) -->
        <div id="readerToolsDrawer" class="reader-tools-drawer hidden">
          <div class="drawer-row">
            <span class="drawer-label">快速跳页</span>
            <input id="readerPageSlider" type="range" min="1" max="1" value="1" />
            <span id="readerSliderVal" class="drawer-val">1 / 1</span>
          </div>
          <div class="drawer-row">
            <span class="drawer-label">夜间亮度</span>
            <input id="readerBrightnessSlider" type="range" min="35" max="100" value="100" />
            <span id="readerBrightnessVal" class="drawer-val">100%</span>
          </div>
          <div class="drawer-actions">
            <button id="autoScrollBtn" class="btn btn-secondary btn-xs" type="button">自动滚动：关</button>
            <button id="autoScrollSpeedBtn" class="btn btn-ghost btn-xs" type="button">速度：中</button>
            <button id="readerRtlBtn" class="btn btn-ghost btn-xs hide-xs" type="button">双页：右→左</button>
            <button id="readerFullscreenBtn" class="btn btn-ghost btn-xs" type="button">全屏阅读</button>
            <button id="readerDownloadPdfBtn" class="btn btn-secondary btn-xs" type="button">本话 PDF</button>
          </div>
        </div>

        <div id="readerCanvas" class="reader-canvas"></div>

        <div class="reader-footer" id="readerFooter">
          <button id="prevChapterBtn" class="btn btn-secondary" type="button">← 上一话</button>
          <div id="singlePageControls" class="single-page-controls hidden">
            <button id="prevPageBtn" class="btn btn-secondary" type="button">上一页</button>
            <input id="jumpPageInput" type="number" min="1" value="1" aria-label="跳转页码" />
            <button id="nextPageBtn" class="btn btn-secondary" type="button">下一页</button>
          </div>
          <button id="nextChapterBtn" class="btn btn-secondary" type="button">下一话 →</button>
        </div>
      </section>
    </main>

    <!-- Back to Top Floating Button -->
    <button id="backToTopBtn" class="back-to-top hidden" type="button" title="回到顶部" aria-label="回到顶部">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </button>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-box">
      <div class="spinner"></div>
      <span id="loadingText">正在加载...</span>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- Floating Download Progress Dock -->
  <div id="downloadDock" class="download-dock hidden">
    <div class="download-dock-header">
      <div class="download-dock-title">
        <span class="download-pulse"></span>
        <strong id="downloadTitle">准备下载...</strong>
      </div>
      <button id="cancelDownloadBtn" class="btn btn-ghost btn-xs" type="button">取消</button>
    </div>
    <div class="progress-bar-track">
      <div id="downloadProgressBar" class="progress-bar-fill" style="width: 0%"></div>
    </div>
    <div class="download-dock-meta">
      <span id="downloadStatusText" class="muted">等待开始</span>
      <span id="downloadPercentText" class="download-percent">0%</span>
    </div>
  </div>
</body>
</html>
